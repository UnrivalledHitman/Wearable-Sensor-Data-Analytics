# WESAD, bigru_attn, three_class, normalisation: first5.
# Generated by make_configs.py; edit that script, not this file.

[run]
name = "e_three_class_bigru_attn_first5_w60"
seed = 42

[paths]  # relative to Code/
raw_dir = "WESAD"
data_dir = "data_clean_w60_s10_r32_first5"
out_dir = "runs/m5/e_three_class_bigru_attn_first5_w60"

[preprocess]
mode = "clean"
dataset = "wesad"
target_rate = 32
window_sec = 60
stride_sec = 10
min_label_purity = 1.0
subject_normalisation = true
normalisation_source = "first_minutes"
normalisation_minutes = 5.0

[model]
arch = "seq"
rnn_hidden = 128
rnn_layers = 2
attn_heads = 4
dropout = 0.3
conv_channels = [64, 64, 64, 64]
downsample = [2, 2, 2, 2]
kernel_size = 5
rnn = "gru"
bidirectional = true
attention = true

[train]
task = "three_class"
balancing = "weighted_sampler"
batch_size = 128
epochs = 40
lr = 1e-3
lr_scheduler = "plateau"
patience = 8
grad_clip = 5.0
validation = "subjects"
val_subjects = 2
val_fraction = 0.1
