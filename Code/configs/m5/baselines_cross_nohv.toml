# M5 part 4b: train on all of WESAD (wrist features, binary), test on every
# Stress-Predict participant; hyperventilation excluded.

[run]
name = "m5_baselines_cross_nohv"
seed = 42

[paths]  # relative to Code/
raw_dir = "WESAD"
test_raw_dir = "Stress-Predict"
features_dir = "features"
out_dir = "runs/m5/baselines_cross_nohv"

[windows]
window_sec = [60]
stride_sec = 5
min_label_purity = 1.0

[data]
test_dataset = "stress_predict"
test_exclude_hyperventilation = true

[eval]
tasks = ["binary"]
feature_sets = ["wrist_physio", "wrist_all"]
classifiers = ["DT", "RF", "AB", "LDA", "kNN"]
normalisation = ["none", "rest_minutes:5", "recording"]
