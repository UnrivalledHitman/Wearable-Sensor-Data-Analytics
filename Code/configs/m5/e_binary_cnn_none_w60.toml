# WESAD, cnn, binary, normalisation: none.
# Generated by make_configs.py; edit that script, not this file.

[run]
name = "e_binary_cnn_none_w60"
seed = 42

[paths]  # relative to Code/
raw_dir = "WESAD"
data_dir = "data_clean_w60_s10_r32_none"
out_dir = "runs/m5/e_binary_cnn_none_w60"

[preprocess]
mode = "clean"
dataset = "wesad"
target_rate = 32
window_sec = 60
stride_sec = 10
min_label_purity = 1.0
subject_normalisation = false

[model]
arch = "seq"
rnn_hidden = 128
rnn_layers = 2
attn_heads = 4
dropout = 0.3
conv_channels = [64, 64, 64, 64]
downsample = [2, 2, 2, 2]
kernel_size = 5
rnn = "none"
attention = false

[train]
task = "binary"
balancing = "weighted_sampler"
batch_size = 128
epochs = 40
lr = 1e-3
lr_scheduler = "plateau"
patience = 8
grad_clip = 5.0
validation = "subjects"
val_subjects = 2
val_fraction = 0.1
