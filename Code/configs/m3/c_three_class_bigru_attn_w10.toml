# Window length: bigru_attn, three_class, 10 s windows.
# Generated by make_configs.py; edit that script, not this file.

[run]
name = "c_three_class_bigru_attn_w10"
seed = 42

[paths]  # relative to Code/
raw_dir = "WESAD"
data_dir = "data_clean_w10_r32"
out_dir = "runs/m3/c_three_class_bigru_attn_w10"

[preprocess]
mode = "clean"
target_rate = 32
window_sec = 10
stride_sec = 5
min_label_purity = 1.0
subject_normalisation = true

[model]
arch = "seq"
rnn_hidden = 128
rnn_layers = 2
attn_heads = 4
dropout = 0.3
conv_channels = [64, 64, 64, 64]
downsample = [2, 2, 2, 2]
kernel_size = 5
rnn = "gru"
bidirectional = true
attention = true

[train]
task = "three_class"
balancing = "weighted_sampler"
batch_size = 128
epochs = 40
lr = 1e-3
lr_scheduler = "plateau"
patience = 8
grad_clip = 5.0
validation = "subjects"  # early stopping on two held-out training subjects
val_subjects = 2
val_fraction = 0.1       # unused with subject validation
